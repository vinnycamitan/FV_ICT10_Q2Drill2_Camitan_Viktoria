
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Member Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
    background-image: url("https://i.pinimg.com/736x/d9/d5/30/d9d530a8dae2052f50259b13b73dcccf.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
}

        .main-card {
            max-width: 750px;
            margin: 50px auto;
            padding: 30px;
            background-color: rgba(235, 249, 255, 0.94);
            border-radius: 18px;
            box-shadow: 0 4px 15px #2468b533;
            border: 2px solid #8acbff;
        }

        h1 {
            color: #1765c1;
            font-weight: bold;
        }

        .btn-add {
            background: linear-gradient(180deg, #75baff, #347be8);
            color: white;
            border: 1px solid #2868cc;
        }

        .btn-add:hover {
            background: linear-gradient(180deg, #65a9f2, #225fc5);
            color: white;
        }

        .result-box {
            background-color: #e0f4ff;
            border: 1px solid #a4d9ff;
            border-radius: 12px;
            padding: 20px;
            overflow-wrap: anywhere;
        }

        #member-list {
            line-height: 2;
            color: #245a96;
        }

        .total-number {
            color: #38a52b;
            font-size: 2rem;
            font-weight: bold;
        }

        .form-control {
            border: 1px solid #94caff;
            background-color: #f7fcff;
        }

        .form-control:focus {
            border-color: #438de8;
            box-shadow: 0 0 0 0.2rem #438de833;
        }

        .form-label,
        .result-box h4,
        .result-box h5 {
            color: #245a96;
        }

        hr {
            color: #78b9ed;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main-card">
            <h1 class="text-center mb-2">ICT Students' Club Manager</h1>
            <p class="text-center text-muted mb-4">
                Manage and organize your club members in one place ๋🔗 ⭑✮💻₊ ⊹
            </p>

            <!-- Input boxes for the member's name -->
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="first-name" class="form-label">First Name</label>
                    <input type="text" id="first-name" class="form-control"
                           placeholder="Enter first name">
                </div>

                <div class="col-md-6">
                    <label for="last-name" class="form-label">Last Name</label>
                    <input type="text" id="last-name" class="form-control"
                           placeholder="Enter last name">
                </div>

                <div class="col-12">
                    <button py-click="add_member" class="btn btn-add w-100">
                        Add Member
                    </button>
                </div>
            </div>

            <!-- Results section -->
            <div class="result-box mt-4">
                <h4>All Club Members</h4>
                <hr>
                <div id="member-list">Members will appear here.</div>

                <hr>
                <h5>Total Members</h5>
                <div id="member-count" class="total-number">0</div>
            </div>

            <p class="text-muted text-center mt-3 mb-0">
                Student Club Membership System
            </p>
        </div>
    </div>

    <!-- Connect the Python file to the webpage -->
    <script type="py" src="./main.py"></script>
</body>
</html>
